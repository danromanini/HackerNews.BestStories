name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BestStories.slnx

      - name: Build
        run: dotnet build BestStories.slnx -c Release --no-restore

      - name: Test
        run: dotnet test BestStories.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: best-stories-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
